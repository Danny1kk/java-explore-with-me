services:
  stats-db:
    image: postgres:16.1
    container_name: stats-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U practicum -d stats" ]
      interval: 3s
      timeout: 3s
      retries: 10

  main-db:
    image: postgres:16.1
    container_name: main-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U practicum -d ewm" ]
      interval: 3s
      timeout: 3s
      retries: 10

  config-server:
    container_name: config-server
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  discovery-server:
    container_name: discovery-server
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    depends_on:
      config-server:
          condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-server:
    container_name: gateway-server
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy

  stats-server:
    container_name: stats-server
    build:
      context: .
      dockerfile: stats-service/server/Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  main-service:
    container_name: main-service
    build:
      context: .
      dockerfile: core/main-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      main-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy