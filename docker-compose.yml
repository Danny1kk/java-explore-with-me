services:
  stats-db:
    image: postgres:16.1

  main-db:
    image: postgres:16.1

  config-server:
    container_name: config-server
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    ports:
      - "8888:8888"

  discovery-server:
    container_name: discovery-server
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  gateway-server:
    container_name: gateway-server
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  stats-server:
    container_name: stats-server
    build:
      context: .
      dockerfile: stats-service/server/Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - stats-db
      - discovery-server

  main-service:
    container_name: main-service
    build:
      context: .
      dockerfile: core/main-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - main-db
      - discovery-server